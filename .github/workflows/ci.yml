name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install PyYAML==6.0.2 "pytest>=8,<9"
      - name: Test workspace contract
        env:
          PYTHONPATH: modules/merge-policy/src:modules/branch-cleanup/src
        run: pytest -q
